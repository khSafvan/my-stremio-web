<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A24" />
      <stop offset="100%" stop-color="#09090D" />
    </linearGradient>
    <linearGradient id="ticketGrad" x1="120" y1="120" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181820" />
      <stop offset="100%" stop-color="#0D0D11" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#2C2C3A" stroke-width="4" />

  <!-- Cinema Ticket Base inside Icon -->
  <g transform="translate(48, 48) scale(0.8125)">
    <!-- Ticket Body -->
    <rect x="40" y="86" width="432" height="340" rx="68" fill="url(#ticketGrad)" />
    
    <!-- Left Sprocket Perforations -->
    <rect x="92" y="146" width="48" height="64" rx="20" fill="url(#innerGrad)" />
    <rect x="92" y="302" width="48" height="64" rx="20" fill="url(#innerGrad)" />

    <!-- Right Sprocket Perforations -->
    <rect x="372" y="146" width="48" height="64" rx="20" fill="url(#innerGrad)" />
    <rect x="372" y="302" width="48" height="64" rx="20" fill="url(#innerGrad)" />

    <!-- Center Cinema Play Glyph -->
    <path d="M220 180 L332 256 L220 332 Z" fill="url(#innerGrad)" />
  </g>
</svg>
