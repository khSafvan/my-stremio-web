    <body>
        <div id="app">
            <!-- Instant Animated Pre-Hydration Splash Screen -->
            <style>
                #initial-splash {
                    position: fixed;
                    inset: 0;
                    width: 100vw;
                    height: 100vh;
                    background-color: #0D0D11;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    z-index: 99999;
                    user-select: none;
                    overflow: hidden;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif;
                }
                #initial-splash .splash-bg-glow {
                    position: absolute;
                    inset: 0;
                    background: radial-gradient(circle at 50% 48%, rgba(255, 193, 7, 0.08) 0%, rgba(255, 102, 0, 0.03) 40%, rgba(13, 13, 17, 0) 75%);
                    pointer-events: none;
                }
                #initial-splash .splash-center {
                    position: relative;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    z-index: 2;
                }
                #initial-splash .splash-emblem {
                    width: 130px;
                    height: 130px;
                    animation: initEmblemIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                }
                #initial-splash .splash-orbit-ring {
                    transform-origin: 60px 60px;
                    animation: initOrbit 3.2s linear infinite;
                }
                #initial-splash .splash-symbol-group {
                    animation: initHover 2.6s ease-in-out infinite;
                }
                #initial-splash .splash-wordmark {
                    margin-top: 1.5rem;
                    font-size: 2.25rem;
                    font-weight: 800;
                    letter-spacing: -0.02em;
                    line-height: 1;
                    opacity: 0;
                    animation: initWordmarkIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
                }
                #initial-splash .wordmark-spring {
                    color: #EDEDF2;
                }
                #initial-splash .wordmark-roll {
                    color: #FFC107;
                    margin-left: 2px;
                    text-shadow: 0 2px 14px rgba(255, 193, 7, 0.4);
                }
                #initial-splash .splash-tagline {
                    margin-top: 0.625rem;
                    font-size: 0.75rem;
                    font-weight: 600;
                    letter-spacing: 0.22em;
                    text-transform: uppercase;
                    color: #8F8FA0;
                    opacity: 0;
                    animation: initTaglineIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
                }
                #initial-splash .splash-laser-track {
                    margin-top: 1.75rem;
                    width: 140px;
                    height: 3px;
                    background: rgba(255, 255, 255, 0.08);
                    border-radius: 3px;
                    overflow: hidden;
                    position: relative;
                    opacity: 0;
                    animation: initTrackIn 1s ease-out 0.5s forwards;
                }
                #initial-splash .splash-laser-beam {
                    position: absolute;
                    top: 0;
                    left: 0;
                    height: 100%;
                    width: 45%;
                    border-radius: 3px;
                    background: linear-gradient(90deg, transparent, #FF6600, #FFC107, transparent);
                    box-shadow: 0 0 10px rgba(255, 193, 7, 0.8), 0 0 4px rgba(255, 102, 0, 0.9);
                    animation: initScan 1.6s ease-in-out infinite;
                }
                @keyframes initEmblemIn {
                    0% { opacity: 0; transform: scale(0.72) translateY(12px); }
                    100% { opacity: 1; transform: scale(1) translateY(0); }
                }
                @keyframes initOrbit {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
                @keyframes initHover {
                    0%, 100% { transform: translate(26.7px, 26px) scale(0.13); }
                    50% { transform: translate(26.7px, 23.5px) scale(0.134); }
                }
                @keyframes initWordmarkIn {
                    0% { opacity: 0; transform: translateY(8px); }
                    100% { opacity: 1; transform: translateY(0); }
                }
                @keyframes initTaglineIn {
                    0% { opacity: 0; letter-spacing: 0.1em; }
                    100% { opacity: 0.8; letter-spacing: 0.22em; }
                }
                @keyframes initTrackIn {
                    0% { opacity: 0; transform: scaleX(0.4); }
                    100% { opacity: 1; transform: scaleX(1); }
                }
                @keyframes initScan {
                    0% { left: -45%; }
                    100% { left: 100%; }
                }
            </style>
            <div id="initial-splash">
                <div class="splash-bg-glow"></div>
                <div class="splash-center">

                        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%; display: block; overflow: visible;">

                                </filter>
