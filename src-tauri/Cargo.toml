[package]
name = "springroll"
version = "5.0.0"
description = "Springroll Desktop - Next-Generation High-Performance Streaming Hub"
authors = ["Springroll Authors", "Stremio Open-Source Contributors"]
license = "GPL-2.0"
repository = "https://github.com/Stremio/stremio-web"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "springroll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
libc = "0.2"
libmpv2 = "5.0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
async-channel = "2"

